name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 是必须的：文章的发布日期 / 更新时间来自各自的首次与最后提交时间，
      # 默认的浅克隆只有最后一个提交，会让所有文章都变成同一天
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm 版本由 package.json 的 packageManager 字段决定，这里不要再写 version
      - uses: pnpm/action-setup@v4

      # 固定到 24：Astro 7 要求 node >= 22.23.4，而 setup-node 的 "22"
      # 会随 runner 镜像解析到不同的补丁版本（曾抓到 22.23.3 导致构建失败）
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # build 已包含 astro check 与 pagefind 索引，缺一不可
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log

      # 构建失败时把关键日志写成 annotation：
      # Actions 的原始日志必须登录才能看，annotation 可以用 API 匿名读取，便于在无 gh CLI 时定位问题
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          if [ ! -f build.log ]; then
            echo "::error title=build::build.log 不存在，构建未产生日志"
            exit 0
          fi
          {
            grep -inE "error|cannot|invalid|missing|failed|✗|✘" build.log | head -n 15
            echo "--- last 8 lines ---"
            tail -n 8 build.log
          } | while IFS= read -r line; do
            line=${line//'%'/'%25'}
            line=${line//$'\r'/}
            printf '::error title=build::%s\n' "$line"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
